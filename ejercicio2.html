<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 2</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
</head>
  </head>
  <body>
    <a-scene>
      <!-- Assets -->
    <a-assets>
      <a-asset-item id="drone" src="D_mech_drone.glb"></a-asset-item>
      <audio id="musica" src="Invierno_Allegro_estilo_Vivaldi_4.mp3" preload="auto"></audio>
    </a-assets>
    <!-- Piso gris 10 x 10 m, acostado -->
    <a-plane width="10" height="10" rotation="-90 0 0" color="gray"></a-plane>
    <!-- Personaje: 4 m al frente, mitad de tamano, girado 180 en Y, con su animacion.
         La musica suena al hacer clic sobre el -->
    <a-entity gltf-model="#drone"
              position="0 0 -4"
              scale="0.5 0.5 0.5"
              rotation="0 180 0"
              animation-mixer
              sound="src: #musica; on: click">
    </a-entity>



    </a-scene>
  </body>
</html>
