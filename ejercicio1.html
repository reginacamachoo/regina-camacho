<!DOCTYPE html>
<html>
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 2</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
 </head>
<body>
  <a-scene>
    <!-- Piso gris 10 x 10 m, acostado -->
    <a-plane width="10" height="10" rotation="-90 0 0" color="gray"></a-plane>
    <!-- Caja roja 1 m, sobre el piso, 3 m al frente y 1 m a la izquierda -->
    <a-box width="1" height="1" depth="1" color="red"
           position="-1 0.5 -3"
           animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 4000; easing: linear; loop: true">
    </a-box>
    <!-- Esfera azul radio 0.5, a 2 m de altura y 4 m al frente -->
    <a-sphere radius="0.5" color="blue" position="0 2 -4"></a-sphere>
    <!-- Cielo negro -->
    <a-sky color="black"></a-sky>

  </a-scene>
</body>
</html>
