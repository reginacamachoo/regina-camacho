<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
    <!-- Piso gris 10 x 10 m, acostado -->
      <a-plane width="10" height="10" rotation="-90 0 0" color="gray"></a-plane>


    <!-- ============ AQUI VAN TUS OBJETOS ============ -->

    <!-- Camara con cursor (para que funcionen los clics) -->
    <a-entity camera look-controls wasd-controls>
      <a-cursor color="#333"></a-cursor>
    </a-entity>

  </a-scene>
</body>
</html>
